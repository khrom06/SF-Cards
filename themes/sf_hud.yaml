# SF HUD theme — optional companion of SF Cards.
# Dresses the NATIVE Home Assistant cards (history graphs, logbook, lists, entities…) in the colours of the SF cards.
# Install: copy this file to /config/themes/ (with `frontend: themes: !include_dir_merge_named themes` in configuration.yaml),
# reload themes, then set `theme: SF HUD` on a dashboard view.
SF HUD:
  primary-color: "#00e5ff"
  accent-color: "#ffb300"
  primary-background-color: "#03080f"
  secondary-background-color: "#06101d"
  lovelace-background: "radial-gradient(ellipse at 50% -10%, #0b2340 0%, #050b16 55%, #020509 100%) fixed"
  card-background-color: "rgba(6, 16, 29, 0.86)"
  ha-card-background: "rgba(6, 16, 29, 0.86)"
  ha-card-border-color: "rgba(0, 229, 255, 0.22)"
  ha-card-border-radius: "14px"
  ha-card-box-shadow: "inset 0 0 40px rgba(0, 229, 255, 0.05), 0 0 22px rgba(0, 229, 255, 0.07)"
  ha-card-header-color: "#00e5ff"
  primary-text-color: "#cfefff"
  secondary-text-color: "#7fa3bd"
  disabled-text-color: "#5b6b7d"
  divider-color: "rgba(0, 229, 255, 0.15)"
  state-icon-color: "#00e5ff"
  paper-item-icon-color: "#7fa3bd"
  app-header-background-color: "#03080f"
  app-header-text-color: "#00e5ff"
  input-fill-color: "rgba(0, 229, 255, 0.05)"
  mdc-theme-surface: "#06101d"
  history-unavailable-color: "#5b6b7d"
