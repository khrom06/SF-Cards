name: E2E on a real Home Assistant
# Démarre un vrai Home Assistant en conteneur et pilote son frontend avec Playwright (éprouvé le 2026-11-03 : vert sur la version corrigée,
# rouge « GEL » sur v1.10.0). Détecte les gels et erreurs que les tests simulés (test/run.sh) ne peuvent pas voir.
# Automatique à chaque push / pull request qui touche les cartes ou les tests ; lançable à la main (version de HA, version de SF-Cards au choix).
on:
  push:
    branches: [main]
    paths: ["dist/**", "test/**", ".github/workflows/ha-e2e.yml"]
  pull_request:
    paths: ["dist/**", "test/**", ".github/workflows/ha-e2e.yml"]
  workflow_dispatch:
    inputs:
      ha_version:
        description: "Image Home Assistant (ex. 2026.10, stable, beta)"
        default: "stable"
      sf_ref:
        description: "Version de SF-Cards à tester (tag ou commit, ex. v1.10.0). Vide = dist/sf-cards.js du commit courant. Sert à vérifier que le test détecte un ancien bug."
        default: ""
concurrency:
  group: ha-e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Configuration Home Assistant de test
        env:
          SF_REF: ${{ inputs.sf_ref }}
        run: |
          mkdir -p ha-config/www
          if [ -n "$SF_REF" ]; then
            git show "$SF_REF:dist/sf-cards.js" > ha-config/www/sf-cards.js
            echo "SF-Cards testé : $SF_REF ($(git rev-parse --short "$SF_REF"))"
          else
            cp dist/sf-cards.js ha-config/www/sf-cards.js
          fi
          cat > ha-config/configuration.yaml <<'YAML'
          default_config:
          template:
            - sensor:
                - name: "E2E Temp A"
                  unique_id: e2e_temp_a
                  unit_of_measurement: "°C"
                  device_class: temperature
                  state: "21.5"
                - name: "E2E Temp B"
                  unique_id: e2e_temp_b
                  unit_of_measurement: "°C"
                  device_class: temperature
                  state: "19.0"
          YAML
      - name: Démarrer Home Assistant
        run: docker run -d --name ha -p 8123:8123 -v "$PWD/ha-config:/config" "ghcr.io/home-assistant/home-assistant:${{ inputs.ha_version || 'stable' }}"
      - name: Installer Playwright
        run: |
          npm init -y >/dev/null
          npm i --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Test E2E
        run: node test/e2e/run.mjs
      - name: Journal de Home Assistant (en cas d'échec)
        if: failure()
        run: docker logs ha 2>&1 | tail -80
