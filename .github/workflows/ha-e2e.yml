name: E2E on a real Home Assistant
# Starts a real Home Assistant in a container and drives its frontend with Playwright (proven on 2026-11-03: green on the fixed version,
# red "FREEZE" on v1.10.0). Detects the freezes and errors that the simulated tests (test/run.sh) cannot see.
# Automatic on every push / pull request that touches the cards or the tests; can be run by hand (HA version and SF-Cards version of your choice).
on:
  push:
    branches: [main]
    paths: ["dist/**", "test/**", ".github/workflows/ha-e2e.yml"]
  pull_request:
    paths: ["dist/**", "test/**", ".github/workflows/ha-e2e.yml"]
  workflow_dispatch:
    inputs:
      ha_version:
        description: "Image Home Assistant (ex. 2026.10, stable, beta)"
        default: "stable"
      sf_ref:
        description: "SF-Cards version to test (tag or commit, e.g. v1.10.0). Empty = dist/sf-cards.js of the current commit. Used to check that the test detects an old bug."
        default: ""
concurrency:
  group: ha-e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Test Home Assistant configuration
        env:
          SF_REF: ${{ inputs.sf_ref }}
        run: |
          mkdir -p ha-config/www
          if [ -n "$SF_REF" ]; then
            git show "$SF_REF:dist/sf-cards.js" > ha-config/www/sf-cards.js
            echo "SF-Cards tested: $SF_REF ($(git rev-parse --short "$SF_REF"))"
          else
            cp dist/sf-cards.js ha-config/www/sf-cards.js
          fi
          cat > ha-config/configuration.yaml <<'YAML'
          default_config:
          template:
            - sensor:
                - name: "E2E Temp A"
                  unique_id: e2e_temp_a
                  unit_of_measurement: "°C"
                  device_class: temperature
                  state: "21.5"
                - name: "E2E Temp B"
                  unique_id: e2e_temp_b
                  unit_of_measurement: "°C"
                  device_class: temperature
                  state: "19.0"
          YAML
      - name: Start Home Assistant
        run: docker run -d --name ha -p 8123:8123 -v "$PWD/ha-config:/config" "ghcr.io/home-assistant/home-assistant:${{ inputs.ha_version || 'stable' }}"
      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm i --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Test E2E
        run: node test/e2e/run.mjs
      - name: Home Assistant log (on failure)
        if: failure()
        run: docker logs ha 2>&1 | tail -80
