name: Release assets
# A release must carry sf-cards.js and every sf-cards-i18n-<lang>.js: the Marketplace / HACS install the release assets, and a missing
# language file switches that language to English. This fails visibly as soon as such a release is published or edited.
on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to check (e.g. v1.27.0)"
        required: true
permissions:
  contents: read
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - name: Every file is attached
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: node scripts/check-release-assets.mjs "$TAG"
