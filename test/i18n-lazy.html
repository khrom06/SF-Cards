<!doctype html>
<meta charset="utf-8">
<!-- Language files test (run by run.sh in headless Chrome): only sf-cards.js is loaded here, without test/i18n-all.js. French and English
     must be there at once; another language is fetched from the folder of sf-cards.js the first time a card needs it, and the card redraws
     itself; a missing file leaves English and says so once. Writes its verdict (JSON) into #result. -->
<body>
<script>
class FakeIcon extends HTMLElement {} customElements.define("ha-icon", FakeIcon);
window.requestAnimationFrame = (f) => setTimeout(f, 0);
window.__SF_TEST = true;
const warns = [], _w = console.warn.bind(console); console.warn = (...a) => { warns.push(a.join(" ")); _w(...a); };
</script>
<script src="../dist/sf-cards.js"></script>
<script src="fixtures.js"></script>
<script>
(async () => {
  const failures = [], fail = (m) => failures.push(m), wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const until = async (pred, ms = 3000) => { for (let t = 0; t < ms && !pred(); t += 50) await wait(50); return pred(); };
  try {
    const S2 = __SF;
    // the bundle's address from an error stack, in the three browsers' formats (Home Assistant loads it as a module: no currentScript)
    for (const [stack, want] of [
      ["Error\n    at http://ha.local:8123/hacsfiles/SF-Cards/sf-cards.js?hacstag=12345:1:2345\n    at x", "http://ha.local:8123/hacsfiles/SF-Cards/sf-cards.js?hacstag=12345"],
      ["@https://ha.example.org/hacsfiles/SF-Cards/sf-cards.js?hacstag=9:1:20\n", "https://ha.example.org/hacsfiles/SF-Cards/sf-cards.js?hacstag=9"],
      ["global code@https://ha.example.org/local/sf-cards.js:1:30", "https://ha.example.org/local/sf-cards.js"],
      ["at http://127.0.0.1/my.jsdir/x/sf-cards.js?v=1:1:2", "http://127.0.0.1/my.jsdir/x/sf-cards.js?v=1"],
      ["at https://home.jsmith.net/hacsfiles/SF-Cards/sf-cards.js:3:4", "https://home.jsmith.net/hacsfiles/SF-Cards/sf-cards.js"],
      ["at https://h/frontend_latest/app.abc.js:1:1\n at https://h/hacsfiles/SF-Cards/sf-cards.js?hacstag=1:1:1", "https://h/hacsfiles/SF-Cards/sf-cards.js?hacstag=1"],
    ]) { const got = S2.sfI18nUrlFromStack(stack); if (got !== want) fail("stack " + JSON.stringify(stack.slice(0, 60)) + " -> " + got); }
    if (!/\/dist\/sf-cards\.js$/.test(S2.SF_SELF_URL)) fail("the bundle finds its own address: " + S2.SF_SELF_URL);
    if (!S2.sfI18nHas("fr") || !S2.sfI18nHas("en") || S2.sfI18nHas("de")) fail("French and English are embedded, German is not");
    if (S2.SF_T["common.no_data"].length !== 2) fail("the bundle carries two columns of texts");
    // a card drawn for a German user: English first, German once the file is there, without any new hass update
    const el = document.createElement("sf-cells-card"); el.setConfig({}); document.body.appendChild(el);
    el.hass = { ...HASS({ ...base }, "de") }; await wait(30);
    const de = S2.SF_T["common.no_data"];
    if (!(await until(() => S2.sfI18nHas("de")))) fail("the German file is loaded on demand");
    if (!/de\b/.test(String(document.querySelector('script[src*="sf-cards-i18n-de.js"]') && document.querySelector('script[src*="sf-cards-i18n-de.js"]').src))) fail("loaded from the folder of sf-cards.js");
    if (!/\?v=\d+\.\d+\.\d+/.test(document.querySelector('script[src*="sf-cards-i18n-de.js"]').src)) fail("the language file carries the version (cache)");
    if (de[3] !== "keine Daten") fail("German texts merged: " + JSON.stringify(de));
    const txt = () => [...el.shadowRoot.childNodes].filter((n) => n.nodeName !== "STYLE").map((n) => n.textContent).join(" ");
    if (!(await until(() => /BATTERIEN|Batterien|Sensorbatterien/i.test(txt())))) fail("the card redraws itself in German: " + txt().replace(/\s+/g, " ").slice(0, 160));
    el.hass = { ...HASS({ ...base }, "de") }; await wait(30);
    if (document.querySelectorAll('script[src*="sf-cards-i18n-de.js"]').length !== 1) fail("a language is loaded once");
    el.remove();
    // the automatic dashboard waits for the language before writing its titles
    const Strat = customElements.get("ll-strategy-dashboard-sf-home");
    const d = await Strat.generate({}, { ...HASS({ ...base }, "it"), areas: { k: { area_id: "k", name: "Cucina", temperature_entity_id: "sensor.air_ti" } }, entities: {}, devices: {} });
    if (!d.views.some((v) => v.title === "Stanze")) fail("strategy titles in Italian: " + d.views.map((v) => v.title).join());
    // an editor drawn in Polish redraws itself
    const ed = document.createElement("sf-cells-card-editor"); ed.hass = HASS({ ...base }, "pl"); ed.setConfig({}); document.body.appendChild(ed);
    if (!(await until(() => S2.sfI18nHas("pl")))) fail("the Polish file is loaded for the editor");
    ed.remove();
    // a missing file: English stays, one console warning naming the file, never a broken card
    S2.sfI18nBase(location.href.replace(/[^/]*$/, "nowhere/"));
    const ok = await S2.sfI18nLoad("ru");
    if (ok !== false || S2.SF_LANG_STATE.ru !== "failed") fail("a missing language file is reported as failed");
    if (warns.filter((w) => /sf-cards-i18n-ru\.js/.test(w)).length !== 1) fail("one console warning names the missing file: " + JSON.stringify(warns));
    const er = document.createElement("sf-cells-card"); er.setConfig({}); document.body.appendChild(er); er.hass = { ...HASS({ ...base }, "ru") }; await wait(60);
    if (!er.shadowRoot.textContent.trim() || /[а-я]/i.test(er.shadowRoot.textContent)) fail("without its file, a Russian user gets the card in English");
    er.hass = { ...HASS({ ...base }, "ru") }; await wait(60); if (warns.filter((w) => /sf-cards-i18n-ru\.js/.test(w)).length !== 1 || document.querySelectorAll('script[src*="i18n-ru"]').length !== 1) fail("a failed language is not retried on every update");
    // a minute later it is tried again (a tablet that booted without Wi-Fi), without a second warning
    S2.SF_LANG_FAILED_AT.ru = Date.now() - 61000; er.hass = { ...HASS({ ...base }, "ru") }; await wait(30); for (let i = 0; i < 40 && document.querySelectorAll('script[src*="i18n-ru"]').length < 2; i++) await wait(50);
    if (document.querySelectorAll('script[src*="i18n-ru"]').length !== 2) fail("a failed language is tried again after a minute");
    await wait(300); if (warns.filter((w) => /sf-cards-i18n-ru\.js/.test(w)).length !== 1) fail("the console says it once, not on every retry");
    er.remove();
    if (await S2.sfI18nLoad("xx") !== false || await S2.sfI18nLoad("fr") !== true) fail("unknown languages are ignored, embedded ones resolve at once");
  } catch (e) { fail("exception: " + (e && e.stack || e)); }
  const pre = document.createElement("pre"); pre.id = "result"; pre.textContent = JSON.stringify({ ok: !failures.length, failures }); document.body.appendChild(pre);
})();
</script>
</body>
