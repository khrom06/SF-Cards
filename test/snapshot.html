<!doctype html>
<meta charset="utf-8">
<!-- Render snapshots: renders every card (full config) in every language, dark and light, with a frozen clock, and writes a hash of each
     rendered HTML into #result. run.sh compares them with test/snapshots.json: a refactoring that must not change what is displayed
     (translation ids, CSS variables, shared loaders…) has to leave every hash identical. -->
<body>
<script>
// Frozen, reproducible environment: fixed clock, seeded Math.random, no real frames.
{ const Real = Date, FIXED = Real.parse("2026-06-15T10:00:00Z");
  class FDate extends Real { constructor(...a) { if (a.length) super(...a); else super(FIXED); } static now() { return FIXED; } }
  window.Date = FDate;
  let seed = 12345; Math.random = () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }; }
class FakeIcon extends HTMLElement {} customElements.define("ha-icon", FakeIcon);
window.requestAnimationFrame = (f) => setTimeout(f, 0);
window.__errors = [];
window.addEventListener("error", (e) => window.__errors.push(e.message));
</script>
<script src="../dist/sf-cards.js"></script>
<script src="fixtures.js"></script>
<script>
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
// cyrb53: small, fast, deterministic 53-bit string hash (not cryptographic; only used to detect changes)
const hash = (str) => { let h1 = 0xdeadbeef, h2 = 0x41c6ce57; for (let i = 0; i < str.length; i++) { const ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909); h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36); };
(async () => {
  const out = {}, langs = ["fr", "en", "es", "de", "nl", "it", "pt", "pl", "ru", "zh", "ar"];
  for (const tag of Object.keys(FULL)) for (const lang of langs) for (const theme of ["dark", "light"]) {
    const el = document.createElement(tag); el.setConfig({ ...FULL[tag], theme }); document.body.appendChild(el);
    el.hass = HASS(base, lang); await wait(8);
    // two hashes per render: the markup without <style> ("structure + text") and the CSS, so that a CSS-only change is told apart from a content change
    const full = el.shadowRoot ? el.shadowRoot.innerHTML : "", css = (full.match(/<style>[\s\S]*?<\/style>/g) || []).join(""), markup = full.replace(/<style>[\s\S]*?<\/style>/g, "");
    out[`${tag}|${lang}|${theme}`] = hash(markup + "|" + (el.getAttribute("theme") || "") + "|" + (el.getAttribute("dir") || "")) + "." + hash(css) + "." + hash(el.shadowRoot ? el.shadowRoot.textContent.replace(/\s+/g, " ") : ""); el.remove();
  }
  const pre = document.createElement("pre"); pre.id = "result"; pre.textContent = JSON.stringify({ errors: window.__errors, hashes: out }); document.body.appendChild(pre);
})();
</script>
