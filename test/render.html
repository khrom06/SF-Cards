window.requestAnimationFrame = (f) => setTimeout(f, 0);   // headless : pas de vraies frames, on rend tout de suite
window.__errors = [];
window.addEventListener("error", (e) => window.__errors.push(`${e.message} @${(e.filename || "").split("/").pop()}:${e.lineno}`));
window.__missing = new Set();
</script>
<script src="../dist/sf-cards.js"></script>
<script>

// Comme dans HA, chaque état porte son entity_id.

  "sf-alert-card": { leaks: ["binary_sensor.leak"], doors: ["binary_sensor.door"], alarm: "alarm_control_panel.home", hide_sim: true },

  "sf-radar-card": { people: [{ name: "Alice", person: "person.alice", color: "#00e5ff" }], rooms: [{ label: "Living", entity: "binary_sensor.door" }] },

  "sf-bridge-card": { weather: "weather.home", outdoor: "sensor.out", price: "sensor.price", hc_price: "sensor.price", mode: "input_select.mode", solar_left: "sensor.solar_left",

  "sf-reactor-card": { solar: "sensor.solar", grid: "sensor.grid", fossil: "sensor.fossil", price: "sensor.price", battery_soc: "sensor.bat_soc", battery_power: "sensor.bat_p",

  "sf-climate-card": { mode: "input_select.mode", rooms: [{ name: "Living", climate: "climate.room", temp: "sensor.temp", hum: "sensor.hum", target: "input_number.target", regul: "input_boolean.auto", window: "binary_sensor.window" }] },
  "sf-console-card": { title: "Controls", groups: [{ title: "Home", items: [{ kind: "dimmer", entity: "light.lamp", label: "Lamp" }, { kind: "toggle", entity: "switch.plug", label: "Plug" },
    { kind: "cover", entity: "cover.shutter", label: "Shutter" }, { kind: "select", entity: "input_select.mode", label: "Mode" }, { kind: "sensor", entity: "sensor.temp", label: "Temp" },

  "sf-camera-card": { cameras: [{ entity: "camera.front", name: "Front" }] },
  "sf-setpoints-card": { columns: [{ label: "Day" }], rows: [{ name: "Living", entities: ["input_number.target"] }] },
  "sf-ledger-card": { total_cost: "sensor.eur", solar_fraction: "sensor.fossil", avg_price: "sensor.price", devices: [{ name: "EV", total: "sensor.kwh", edf: "sensor.kwh", solar: "sensor.kwh", cost: "sensor.eur" }] },
  "sf-cells-card": {},

  "sf-launcher-card": { tiles: [{ name: "Climate", summary: "room", card: { type: "custom:sf-climate-card", rooms: [{ name: "L", climate: "climate.room", temp: "sensor.temp", target: "input_number.target" }] } },
    { name: "Battery", summary: "battery", card: { type: "custom:sf-battery-card", soc: "sensor.bat_soc", power: "sensor.bat_p" } }] },

// Même chose sans aucune entité de production solaire ni de batterie : rien de « solaire » ne doit apparaître.
const NOSOLAR = {
  "sf-bridge-card": { weather: "weather.home", outdoor: "sensor.out", price: "sensor.price" },
  "sf-reactor-card": { grid: "sensor.grid", devices: [{ name: "EV", entity: "sensor.ev" }] },
  "sf-ledger-card": { total_cost: "sensor.eur", devices: [{ name: "EV", total: "sensor.kwh", cost: "sensor.eur" }] },
  "sf-hangar-card": { cars: [], charger: { power: "sensor.ev" }, flows: { home: "sensor.pac" } },
  "sf-launcher-card": { tiles: [{ name: "Energy", summary: "energy", card: { type: "custom:sf-reactor-card", grid: "sensor.grid" } }] },

const failures = [];
const fail = (m) => failures.push(m);
const mount = (tag, cfg, language, states) => {
  const el = document.createElement(tag);
  el.setConfig(cfg);

const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const text = (el) => (el.shadowRoot ? el.shadowRoot.textContent : "");

// Enregistre les clés de traduction demandées mais absentes de la table (ou incomplètes) pour une langue ≠ fr.
const realTr = sfTr;
window.sfTr = (lang, key, vars) => {
  if (lang !== "fr") {
    const e = SF_T[key];
    if (!e) { if (/[^\x00-\x7F]|\s/.test(key)) window.__missing.add(`${lang}: ${key}`); }
    else if (e.length < 10 || e.some((x) => !x)) window.__missing.add(`${lang}: ${key} (incomplète)`);
  }
  return realTr(lang, key, vars);
};

(async () => { try {
  // 1. Chaque carte, chaque langue, config complète : pas d'erreur, pas de rendu vide, pas de « undefined / NaN ».
  for (const language of ["en", "fr", "es", "de", "nl", "it", "pt", "pl", "ru", "zh", "ar"]) {
    for (const [tag, cfg] of Object.entries(FULL)) {
      const el = mount(tag, cfg, language);
      await wait(40);
      const t = text(el);
      if (!t.trim()) fail(`${tag} [${language}] : rendu vide`);
      if (/undefined|NaN|\[object|null/.test(t)) fail(`${tag} [${language}] : texte suspect « ${(t.match(/.{0,20}(undefined|NaN|\[object|null).{0,20}/) || [""])[0]} »`);
      el.remove();
    }
  }

  { const el = mount("sf-battery-card", {}, "en"); await wait(40);

  { const el = mount("sf-launcher-card", { tiles: [{ name: "Std", hash: "std", card: { type: "vertical-stack", cards: [] } }] }, "en");
    await wait(60);
    el.shadowRoot.querySelector(".tile").click();
    await wait(150);
    const pop = [...document.body.children].filter((n) => n.shadowRoot && n.shadowRoot.querySelector(".sheet")).pop();

    el.remove(); if (pop) pop.remove(); }

  { const el = mount("sf-bridge-card", { weather: "weather.home", price: "sensor.price", hc_price: "sensor.price",
      hc_windows: [{ start: "22:00", end: "02:00" }, { start: "06:00", end: "08:00" }, { start: "14:00", end: "16:00" }] }, "en");
    await wait(40);
    const at = (h, m) => el._isHC(new Date(2026, 0, 5, h, m));
    const exp = [[23, 0, true], [1, 0, true], [4, 0, false], [7, 0, true], [12, 0, false], [15, 0, true], [20, 0, false]];
    for (const [h, m, want] of exp) if (at(h, m).hc !== want) fail(`bridge : à ${h}h${m} HC attendu ${want}, obtenu ${at(h, m).hc}`);
    if (at(15, 0).left !== 60) fail(`bridge : fin de HC à 16h attendue dans 60 min, obtenu ${at(15, 0).left}`);
    if (at(12, 0).left !== 120) fail(`bridge : prochaine HC à 14h attendue dans 120 min, obtenu ${at(12, 0).left}`);
    el.remove();
    const un = mount("sf-bridge-card", { weather: "weather.home", price: "sensor.price" }, "en"); await wait(40);
    if (un._isHC(new Date(2026, 0, 5, 3, 0)).hc !== null) fail("bridge : sans plage ni prix HC, HP/HC devrait être inconnu");
    if (/\bHP\b|\bHC\b/.test(text(un))) fail("bridge : affiche HP/HC alors que rien n'est configuré");
    un.remove(); }
  // 5c. Arabe : sens d'écriture inversé sur la carte ; les autres langues restent de gauche à droite.
  { const ar = mount("sf-machines-card", FULL["sf-machines-card"], "ar"); const en = mount("sf-machines-card", FULL["sf-machines-card"], "en"); await wait(40);
    if (ar.dir !== "rtl") fail("arabe : la carte devrait être en sens rtl"); if (en.dir !== "ltr") fail("anglais : la carte devrait être en sens ltr");
    ar.remove(); en.remove(); }
  // 5d. Variantes de langue de HA (pt-BR, zh-Hans…) : retombent sur la langue de base.
  { const a = mount("sf-radiators-card", FULL["sf-radiators-card"], "pt-BR"); const b = mount("sf-radiators-card", FULL["sf-radiators-card"], "zh-Hans"); await wait(40);
    if (!/Radiadores/.test(text(a))) fail("pt-BR : « Radiadores » attendu"); if (!/暖气片/.test(text(b))) fail("zh-Hans : « 暖气片 » attendu"); a.remove(); b.remove(); }
  // 5e. Plusieurs batteries : niveau pondéré par la capacité (80 % de 10 kWh + 20 % de 5 kWh = 60 %), puissance cumulée,
  //     détail par batterie ; sans capacité, moyenne simple ; un seul nœud dans la carte énergie ; une batterie indisponible est ignorée.
  { const st = { ...base, "sensor.b1": U(80, "%"), "sensor.b1p": U(-1000, "W"), "sensor.b2": U(20, "%"), "sensor.b2p": U(400, "W"), "sensor.b3": S("unavailable") };
    const two = [{ name: "Garage", soc: "sensor.b1", power: "sensor.b1p", capacity_kwh: 10 }, { name: "Cellar", soc: "sensor.b2", power: "sensor.b2p", capacity_kwh: 5 }];
    const c1 = mount("sf-battery-card", { batteries: two }, "en", st); await wait(40); const t1 = text(c1);
    const ring = (el) => (el.shadowRoot.querySelector(".ring .t b") || { textContent: "" }).textContent.trim();
    if (ring(c1) !== "60%") fail(`batteries : niveau pondéré 60 % attendu, obtenu « ${ring(c1)} »`);
    if (!/Garage/.test(t1) || !/Cellar/.test(t1)) fail("batteries : le détail par batterie (noms) est absent");
    if (!/600\s*W/.test(t1)) fail("batteries : puissance cumulée 600 W attendue");
    if (!/Charging/.test(t1)) fail("batteries : état « Charging » attendu (somme négative)");
    c1.remove();
    const c2 = mount("sf-battery-card", { batteries: [{ name: "A", soc: "sensor.b1" }, { name: "B", soc: "sensor.b2" }] }, "en", st); await wait(40);
    if (ring(c2) !== "50%") fail(`batteries : sans capacité, moyenne simple 50 % attendue, obtenu « ${ring(c2)} »`); c2.remove();
    const c3 = mount("sf-battery-card", { batteries: [{ name: "A", soc: "sensor.b1", capacity_kwh: 10 }, { name: "Dead", soc: "sensor.b3", capacity_kwh: 10 }] }, "en", st); await wait(40);
    if (ring(c3) !== "80%") fail(`batteries : une batterie indisponible doit être ignorée (80 % attendu), obtenu « ${ring(c3)} »`); c3.remove();
    const r = mount("sf-reactor-card", { grid: "sensor.grid", batteries: two, devices: [] }, "en", st); await wait(40);
    const nodes = (r.shadowRoot.querySelectorAll(".node") || []); const batNodes = [...nodes].filter((n) => /Battery/.test(n.textContent));
    if (batNodes.length !== 1) fail(`batteries : un seul nœud batterie attendu dans la carte énergie, obtenu ${batNodes.length}`);
    if (batNodes[0] && !/Battery 60 %/.test(batNodes[0].textContent)) fail(`batteries : le nœud devrait afficher « Battery 60 % », obtenu « ${batNodes[0].textContent.trim()} »`);
    r.remove();
    const l = mount("sf-launcher-card", { tiles: [{ name: "Bat", summary: "battery", card: { type: "custom:sf-battery-card", batteries: two } }] }, "en", st); await wait(40);
    if (!/60 %/.test((l.shadowRoot.querySelector(".tile .main") || { textContent: "" }).textContent)) fail("batteries : la tuile du lanceur devrait afficher 60 %"); l.remove(); }
  // 5f. Carte énergie : le solaire est toujours AU-DESSUS du cœur (même abscisse, plus haut), sur téléphone comme sur grand écran.
  for (const width of [380, 760]) {
    const box = document.createElement("div"); box.style.width = width + "px"; document.body.appendChild(box);
    const el = document.createElement("sf-reactor-card"); el.setConfig(FULL["sf-reactor-card"]); box.appendChild(el); el.hass = HASS(base, "en"); await wait(60);
    const pos = (n) => ({ x: parseFloat(/left:([\d.]+)%/.exec(n.getAttribute("style"))[1]), y: parseFloat(/top:([\d.]+)%/.exec(n.getAttribute("style"))[1]) });
    const sol = [...el.shadowRoot.querySelectorAll(".node")].find((n) => /Solar/.test(n.textContent)), core = el.shadowRoot.querySelector(".core");
    if (!sol || !core) fail(`énergie [${width}px] : nœud solaire ou cœur introuvable`);
    else { const a = pos(sol), b = pos(core);
      if (Math.abs(a.x - b.x) > 1) fail(`énergie [${width}px] : le solaire doit être à la verticale du cœur (x ${a.x} / ${b.x})`);
      if (!(a.y < b.y)) fail(`énergie [${width}px] : le solaire doit être au-dessus du cœur (y ${a.y} / ${b.y})`); }
    box.remove(); }
  // 5g. Carte véhicules : « branché » et « en charge » acceptent on/off mais aussi les statuts texte des bornes (casse, espaces, tirets
  //     ignorés), des états personnalisés, et la puissance en secours.
  { const sub = (el) => (el.shadowRoot.querySelector(".head .sub") || { textContent: "" }).textContent.trim().toLowerCase();
    const run = async (cfgCharger, st, want, label) => {
      const el = mount("sf-hangar-card", { cars: [{ name: "Car", soc: "sensor.car_soc", range: "sensor.car_range" }], charger: cfgCharger }, "en", { ...base, ...st });
      await wait(40); const got = sub(el);
      if (got !== want) fail(`véhicules [${label}] : « ${want} » attendu, obtenu « ${got} »`); el.remove(); };
    const X = (id, v) => ({ [id]: S(v) });
    const cc = { connected: "sensor.conn", charging: "sensor.chg", power: "sensor.ev" };
    await run(cc, { ...X("sensor.conn", "on"), ...X("sensor.chg", "on") }, "charging", "on/on");
    await run(cc, { ...X("sensor.conn", "Connected"), ...X("sensor.chg", "Charging") }, "charging", "Connected/Charging");
    await run(cc, { ...X("sensor.conn", "Plugged in"), ...X("sensor.chg", "Not charging") }, "waiting", "Plugged in");
    await run(cc, { ...X("sensor.conn", "Awaiting start"), ...X("sensor.chg", "paused") }, "waiting", "Awaiting start");
    await run(cc, { ...X("sensor.conn", "SuspendedEV"), ...X("sensor.chg", "off") }, "waiting", "SuspendedEV");
    await run(cc, { ...X("sensor.conn", "charge-done"), ...X("sensor.chg", "off") }, "waiting", "charge-done");
    await run(cc, { ...X("sensor.conn", "Disconnected"), ...X("sensor.chg", "Disconnected") }, "idle", "Disconnected");
    await run(cc, { ...X("sensor.conn", "unavailable"), ...X("sensor.chg", "unavailable") }, "idle", "unavailable");
    await run({ ...cc, charging_states: ["Zorglub"] }, { ...X("sensor.conn", "on"), ...X("sensor.chg", "zorglub") }, "charging", "états personnalisés");
    await run({ connected: "sensor.conn", power: "sensor.ev" }, { ...X("sensor.conn", "off"), "sensor.ev": U(3000, "W") }, "charging", "puissance en secours");
    await run({ connected: "sensor.conn", power: "sensor.ev" }, { ...X("sensor.conn", "connected"), "sensor.ev": U(0, "W") }, "waiting", "branché sans puissance"); }
  // 5h. Carte véhicules : mode via `select` (pas seulement input_select), unité km / mi, jusqu'à 3 voitures.
  { const calls = []; const st = { ...base, "select.mode": S("Eco", { options: ["Eco", "Fast"] }), "sensor.rkm": U(100, "km"), "sensor.rmi": U(62, "mi"), "sensor.rnone": S(100) };
    const el = mount("sf-hangar-card", { cars: [{ name: "Car", soc: "sensor.car_soc", range: "sensor.rkm" }], charger: { power: "sensor.ev" }, mode: "select.mode" }, "en", st);
    el.hass = { ...HASS(st, "en"), callService: (d, s, data) => { calls.push([d, s, data]); return Promise.resolve(); } }; await wait(40);
    const btn = [...el.shadowRoot.querySelectorAll(".seg .btn")].find((b) => /Fast/.test(b.textContent));
    if (!btn) fail("véhicules : boutons du mode (entité select) absents"); else { btn.click(); await wait(20);
      if (!calls.some((c) => c[0] === "select" && c[1] === "select_option" && c[2].option === "Fast")) fail("véhicules : un mode `select` doit appeler select.select_option"); }

      await wait(40); const got = (e.shadowRoot.querySelector(".km") || { textContent: "" }).textContent.trim();
      if (got !== want) fail(`véhicules [${label}] : « ${want} » attendu, obtenu « ${got} »`); e.remove(); };
    await rng("sensor.rkm", "", "100 km range", "auto km"); await rng("sensor.rmi", "", "62 mi range", "auto mi"); await rng("sensor.rnone", "", "100 km range", "auto sans unité");
    await rng("sensor.rkm", "mi", "62 mi range", "km → mi"); await rng("sensor.rmi", "km", "100 km range", "mi → km"); await rng("sensor.rkm", "km", "100 km range", "km → km");
    const four = ["a", "b", "c", "d"].map((n) => ({ name: n, soc: "sensor.car_soc" }));
    const e3 = mount("sf-hangar-card", { cars: four, charger: {} }, "en", st); await wait(40);

    if (!e3.shadowRoot.querySelector(".bay.stack")) fail("véhicules : la disposition à 3 voitures est absente"); e3.remove(); }

  //     puissance et noms propres à chaque borne, mode propre à chaque borne, ancienne syntaxe `charger:` inchangée.
  { const calls = []; const two = (a, b) => ({ ...base, "sensor.a_st": S(a), "sensor.b_st": S(b), "sensor.a_p": U(7000, "W"), "sensor.b_p": U(0, "W"), "select.bm": S("Eco", { options: ["Eco", "Fast"] }) });
    const cfg = { cars: [{ name: "Car", soc: "sensor.car_soc", range: "sensor.car_range" }],

    const g3 = sfGuess(H([["sensor.a_soc", S(50, { unit_of_measurement: "%", device_class: "battery" })], ["sensor.b_level", S(60, { unit_of_measurement: "%", device_class: "battery" })], ["sensor.p1", S(1, { unit_of_measurement: "W", device_class: "power" })], ["sensor.p2", S(2, { unit_of_measurement: "W", device_class: "power" })]], "d"), "d", "battery");
    if (g3.power) fail(`devinette : deux puissances sans préférence = ambigu, rien ne doit être rempli (${JSON.stringify(g3)})`);
    const g4 = sfGuess({ ...H([["sensor.hid_soc", S(50, { unit_of_measurement: "%", device_class: "battery" })], ["sensor.ok_soc", S(60, { unit_of_measurement: "%", device_class: "battery" })]], "d"), entities: { "sensor.hid_soc": { entity_id: "sensor.hid_soc", device_id: "d", hidden: true }, "sensor.ok_soc": { entity_id: "sensor.ok_soc", device_id: "d" } } }, "d", "battery");
    if (g4.soc !== "sensor.ok_soc") fail(`devinette : une entité masquée doit être ignorée (${JSON.stringify(g4)})`);
    // URL d'images : javascript: / data:text refusés, relative acceptée, ? ou & selon l'URL.
    if (sfSafeUrl("javascript:alert(1)") || sfSafeUrl("data:text/html;base64,AAAA") || sfSafeUrl("//evil.example/x.png")) fail("URL : javascript:, data:text et // doivent être refusés");
    if (sfSafeUrl("/api/camera_proxy/camera.x?token=1") !== "/api/camera_proxy/camera.x?token=1" || !sfSafeUrl("https://a.example/x.jpg")) fail("URL : une URL relative ou https doit être acceptée");
    const cam = mount("sf-camera-card", { cameras: [{ entity: "camera.front" }] }, "en", { ...base, "camera.front": S("idle", { entity_picture: "javascript:alert(1)" }) }); await wait(60);
    if (/javascript:/.test(cam.shadowRoot.innerHTML)) fail("sécurité : une entity_picture javascript: ne doit jamais atteindre le DOM"); cam.remove();
    // Texte venu d'une entité : jamais interprété comme du HTML (unité, nom, état).
    const evil = '<img src=x onerror="window.__xss=1">'; window.__xss = 0;
    const xs = { ...base, "sensor.rx": S(100, { unit_of_measurement: evil }), "sensor.tx": S(evil, { friendly_name: evil }) };
    const xe = [mount("sf-hangar-card", { cars: [{ name: evil, soc: "sensor.car_soc", range: "sensor.rx" }], charger: { name: evil } }, "en", xs),
      mount("sf-machines-card", { tiles: [{ label: evil, entity: "sensor.tx", kind: "text" }, { label: "u", entity: "sensor.rx", kind: "value" }] }, "en", xs),
      mount("sf-battery-card", { batteries: [{ name: evil, soc: "sensor.car_soc" }, { name: "b", soc: "sensor.bat_soc" }] }, "en", xs),
      mount("sf-cells-card", {}, "en", { ...xs, "sensor.cc": S(10, { device_class: "battery", friendly_name: evil, unit_of_measurement: "%" }) })]; await wait(80);
    if (window.__xss) fail("SÉCURITÉ : du HTML venu d'un état / d'un nom d'entité a été exécuté (XSS)");
    if (xe.some((n) => n.shadowRoot && n.shadowRoot.querySelector('img[src="x"]'))) fail("SÉCURITÉ : du HTML venu d'une entité a créé un élément dans le DOM");
    xe.forEach((n) => n.remove());
    // Langue invalide : les dates (bandeau, alerte) ne plantent pas non plus.
    for (const bad of ["en_US", "", "!!"]) { const b = mount("sf-bridge-card", { weather: "weather.home", price: "sensor.price" }, bad, base); await wait(40);
      if (!text(b).trim()) fail(`bandeau : langue invalide « ${bad} » : rendu vide`); b.remove(); }
    // --sf-theme : relu quand le thème HA change.
    document.documentElement.style.setProperty("--sf-theme", "light");
    const tc = mount("sf-battery-card", { soc: "sensor.bat_soc" }, "en"); tc.hass = { ...HASS(base, "en"), themes: { theme: "A", darkMode: true } }; await wait(40);
    const t1 = tc.getAttribute("theme"); document.documentElement.style.setProperty("--sf-theme", "dark");
    tc.hass = { ...HASS(base, "en"), themes: { theme: "B", darkMode: true } }; await wait(450);
    if (t1 !== "light" || tc.getAttribute("theme") !== "dark") fail(`thème : --sf-theme doit être relue au changement de thème HA (${t1} → ${tc.getAttribute("theme")})`);
    document.documentElement.style.removeProperty("--sf-theme"); tc.remove(); }
  // 5p. Deuxième tour (chasse aux bugs + audit de sécurité) : injection par la CONFIG, regex piégée, noms géants, confirmation persistante,
  //     historique des popups, kW, autonomie « 1h60 », libellés accessibles, configs mal typées, caméra.
  { // -- Injection par la configuration : chaque champ texte est empoisonné, un à la fois, sur les 15 cartes. Rien ne doit s'exécuter.
    window.__pwn = 0; const payloads = ['x"><img src=x onerror="window.__pwn=1">', "x'><svg onload=window.__pwn=1>", 'x" onfocus="window.__pwn=1" autofocus="'];
    const leaves = (o, path = []) => (o && typeof o === "object") ? Object.entries(o).flatMap(([k, v]) => leaves(v, [...path, k])) : (typeof o === "string" ? [path] : []);
    const setAt = (o, path, v) => { let c = o; path.slice(0, -1).forEach((k) => { c = c[k]; }); c[path[path.length - 1]] = v; };
    let count = 0, bad = [];
    for (const [tag, cfg] of Object.entries(FULL)) {
      for (const path of leaves(cfg)) {
        if (path[path.length - 1] === "type") continue;
        for (const pl of payloads) {
          const c = JSON.parse(JSON.stringify(cfg)); setAt(c, path, pl); count++;
          let el; try { el = mount(tag, c, "en"); } catch (e) { continue; }
          await wait(8);
          if (window.__pwn || (el.shadowRoot && el.shadowRoot.querySelector('img[src="x"], svg[onload]'))) { bad.push(`${tag}.${path.join(".")}`); window.__pwn = 0; }
          el.remove(); } } }
    if (bad.length) fail(`SÉCURITÉ : injection par la configuration (${bad.length}) : ${[...new Set(bad)].slice(0, 6).join(", ")}`);
    if (count < 150) fail(`sécurité : le test d'injection n'a couvert que ${count} cas`); }
  { // -- Expression régulière piégée (ReDoS) : ignorée, pas de gel ; une regex valide fonctionne
    const st = { ...base, "sensor.good_batt": S(40, { device_class: "battery", unit_of_measurement: "%" }), "sensor.other_batt": S(50, { device_class: "battery", unit_of_measurement: "%" }),
      "sensor.aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa!": S(30, { device_class: "battery", unit_of_measurement: "%" }) };
    const t0 = performance.now();
    const e = mount("sf-cells-card", { include_pattern: "(a+)+$", exclude_pattern: "(.*)*(.*)*(.*)*z" }, "en", st); await wait(40);
    if (performance.now() - t0 > 1500) fail("sécurité : une regex à quantificateurs imbriqués fige la carte (ReDoS)"); e.remove();
    const ok = mount("sf-cells-card", { include_pattern: "^sensor\\.good" }, "en", st); await wait(40);
    const n = ok.shadowRoot.querySelectorAll(".cell").length; if (n !== 1) fail(`regex : « ^sensor\\.good » doit garder 1 cellule, obtenu ${n}`); ok.remove();
    const inv = mount("sf-cells-card", { include_pattern: "([" }, "en", st); await wait(40); if (!text(inv).trim()) fail("regex : une regex invalide ne doit pas casser la carte"); inv.remove();
    // -- Nom d'entité géant : pas de gel
    const huge = " ".repeat(60000) + "x"; const t1 = performance.now();
    const g = [mount("sf-cells-card", {}, "en", { ...st, "sensor.big": S(10, { device_class: "battery", unit_of_measurement: "%", friendly_name: huge }) }),
      mount("sf-bridge-card", { weather: "weather.home", leaks: ["binary_sensor.lk"] }, "en", { ...base, "binary_sensor.lk": S("on", { friendly_name: huge }) })]; await wait(60);
    if (performance.now() - t1 > 1500) fail("sécurité : un nom d'entité géant fige la carte"); g.forEach((x) => x.remove()); }
  { // -- Climat : une sonde absente ne donne jamais « NaN »
    const e = mount("sf-climate-card", { rooms: [{ name: "L", climate: "climate.room", temp: "sensor.absent" }] }, "en", { ...base, "climate.room": S("heat", { hvac_action: "heating", temperature: 20 }) }); await wait(40);
    if (/NaN|undefined/.test(text(e))) fail("climat : « NaN » affiché quand la température courante est absente"); e.remove(); }
  { // -- Confirmation d'arrêt : elle survit à un rafraîchissement de la carte (la puissance bouge toutes les quelques secondes)
    const calls = []; const mk = (p) => ({ ...base, "switch.sw": S("on"), "sensor.pw": U(p, "W") });
    const e = mount("sf-hangar-card", { cars: [], charger: { power: "sensor.pw", switch: "switch.sw", controls: true } }, "en", mk(1800));
    const spy = (st) => { e.hass = { ...HASS(st, "en"), callService: (d, s, data) => { calls.push([d, s, data]); return Promise.resolve(); } }; }; spy(mk(1800)); await wait(40);
    const stopBtn = () => [...e.shadowRoot.querySelectorAll(".ctl .btn")].find((b) => /Stop|Stop\?/.test(b.textContent) || /stop/i.test(b.getAttribute("title") || ""));
    stopBtn().click(); await wait(20); spy(mk(1795)); await wait(60);
    if (!stopBtn().classList.contains("armed")) fail("confirmation : le bouton armé doit le rester après un rafraîchissement de la carte");
    stopBtn().click(); await wait(20);
    if (calls.filter((c) => c[1] === "turn_off").length !== 1) fail("confirmation : le 2e appui (après rafraîchissement) doit arrêter la charge une seule fois");
    e.remove(); }
  { // -- Historique : un popup ouvert par lien direct se ferme sans quitter la page ; fermer puis ouvrir une autre tuile aussitôt reste ouvert
    const pops = () => [...document.body.children].filter((n) => n.shadowRoot && n.shadowRoot.querySelector(".sheet"));
    history.pushState(null, "", "#previous"); history.pushState(null, "", "#bat");
    const l = mount("sf-launcher-card", { tiles: [{ name: "B", hash: "bat", summary: "text", card: { type: "custom:sf-battery-card", soc: "sensor.bat_soc" } }, { name: "C", hash: "cc", summary: "text", card: { type: "custom:sf-battery-card", soc: "sensor.bat_soc" } }] }, "en");
    await wait(600);
    const p = pops().pop(); if (!p) fail("historique : le lien direct #bat devrait ouvrir le popup");
    else { p.shadowRoot.querySelector(".bar button").click(); await wait(700);
      if (location.hash === "#previous") fail("historique : fermer un popup ouvert par lien direct fait reculer la page (quitte le tableau de bord)"); }
    history.replaceState(null, "", location.pathname + location.search);
    const tiles = l.shadowRoot.querySelectorAll(".tile"); tiles[0].click(); await wait(120);
    pops().pop().shadowRoot.querySelector(".back").click(); tiles[1].click(); await wait(800);
    if (pops().length !== 1) fail(`historique : fermer puis ouvrir une autre tuile aussitôt doit laisser 1 popup ouvert, obtenu ${pops().length}`);
    pops().forEach((x) => x.remove()); l.remove(); history.replaceState(null, "", location.pathname + location.search); }
  { // -- Puissance de borne en kW lue en W ; autonomie jamais « 1h60 »
    const e = mount("sf-hangar-card", { cars: [], charger: { connected: "sensor.cc", power: "sensor.kw" } }, "en", { ...base, "sensor.cc": S("off"), "sensor.kw": U(7.2, "kW") }); await wait(40);
    if (!/7200 W/.test(text(e))) fail("borne : 7,2 kW doit s'afficher « 7200 W »"); if ((e.shadowRoot.querySelector(".head .sub") || { textContent: "" }).textContent.trim().toLowerCase() !== "charging") fail("borne : 7,2 kW sans capteur « en charge » doit compter comme en charge"); e.remove();
    const b = mount("sf-battery-card", { soc: "sensor.s50", power: "sensor.p", capacity_kwh: 10 }, "en", { ...base, "sensor.s50": U(50, "%"), "sensor.p": U(-2500.01, "W") }); await wait(40);
    if (/\dh60/.test(text(b)) || !/full in 2h00/.test(text(b))) fail(`batterie : autonomie arrondie à « 2h00 » attendue, obtenu « ${(text(b).match(/full in \S+|empty in \S+/) || [""])[0]} »`); b.remove(); }
  { // -- Accessibilité : libellés avec espaces, pas de faux bouton, commandes de courant seulement si la valeur est un nombre
    const l = mount("sf-ledger-card", { total_cost: "sensor.eur", devices: [] }, "en"); await wait(40);
    const k = l.shadowRoot.querySelector(".kpi.click"); if (k && /cost\d/i.test(k.getAttribute("aria-label") || "")) fail(`accessibilité : libellé « ${k.getAttribute("aria-label")} » sans espace entre les blocs`); l.remove();
    const m = mount("sf-machines-card", { tiles: [{ label: "NoEnt", kind: "value" }] }, "en"); await wait(40);
    const tl = m.shadowRoot.querySelector(".tile"); if (tl && tl.getAttribute("role") === "button") fail("accessibilité : une tuile sans entité ne doit pas être un bouton"); m.remove();
    const h = mount("sf-hangar-card", { cars: [], charger: { power: "sensor.ev", current: "number.bad", controls: true } }, "en", { ...base, "number.bad": S("abc", { min: 6, max: 16 }), "sensor.ev": U(0, "W") }); await wait(40);
    if (h.shadowRoot.querySelector(".ctlrow")) fail("commandes : un état non numérique ne doit pas proposer − / +"); h.remove(); }
  { // -- Caméra : intervalle borné, relu à chaque setConfig
    const c = mount("sf-camera-card", { cameras: [], refresh: 0 }, "en"); await wait(20);
    if (c._every() !== 5) fail(`caméra : refresh 0 doit retomber sur 5 s, obtenu ${c._every()}`);
    c.setConfig({ cameras: [], refresh: 2 }); if (c._every() !== 2) fail("caméra : setConfig doit relire refresh"); c.remove(); }
  { // -- Configurations mal typées : jamais d'exception
    const bad = [["sf-alert-card", { leaks: "binary_sensor.leak", doors: null }], ["sf-bridge-card", { weather: "weather.home", people: "x", doors: "binary_sensor.door" }],
      ["sf-hangar-card", { cars: "x", chargers: [null, { power: "sensor.ev", charging_states: "Charging" }], charger: "oops" }], ["sf-reactor-card", { grid: "sensor.grid", devices: "sensor.ev" }],
      ["sf-climate-card", { rooms: null }], ["sf-console-card", { groups: "x" }], ["sf-camera-card", { cameras: "camera.front" }], ["sf-setpoints-card", { columns: "x", rows: null }],
      ["sf-ledger-card", { devices: "x" }], ["sf-launcher-card", { tiles: null }], ["sf-cells-card", { exclude: "sensor.x" }], ["sf-radiators-card", { radiators: [null] }], ["sf-battery-card", { batteries: [null, { soc: "sensor.bat_soc" }] }]];
    for (const [tag, cfg] of bad) { try { const e = mount(tag, cfg, "en"); await wait(15); e.remove(); } catch (er) { fail(`${tag} : plante avec une configuration mal typée (${er.message})`); } }
    try { const e = document.createElement("sf-machines-card"); e.setConfig({ tiles: [] }); document.body.appendChild(e); e.hass = { locale: { language: "en" } }; await wait(20); e.remove(); } catch (er) { fail(`hass sans states : exception (${er.message})`); } }
  // 6. Traductions manquantes.
  for (const m of window.__missing) fail(`traduction manquante — ${m}`);
  for (const e of window.__errors) fail(`erreur JavaScript : ${e}`);
  } catch (e) { fail(`le test a planté : ${e && e.stack || e}`); }
  finally {
  const out = document.createElement("pre"); out.id = "result";
  out.textContent = JSON.stringify({ ok: failures.length === 0, failures });
  document.body.appendChild(out);
  }
})();
</script>
