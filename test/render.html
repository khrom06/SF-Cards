<!doctype html>

<body>
<script>
// Faux composants HA : seulement ce dont les cartes ont besoin pour s'afficher.
class FakeIcon extends HTMLElement {} customElements.define("ha-icon", FakeIcon);
window.requestAnimationFrame = (f) => setTimeout(f, 0);   // headless : pas de vraies frames, on rend tout de suite
window.__errors = [];
window.addEventListener("error", (e) => window.__errors.push(`${e.message} @${(e.filename || "").split("/").pop()}:${e.lineno}`));
window.__missing = new Set();
window.__SF_TEST = true;   // expose les fonctions internes à ce test uniquement
window.SF_EVENTS = false;   // les thèmes d'événements dépendent de la date : désactivés pour des tests reproductibles
</script>
<script src="../dist/sf-cards.js"></script>
<script>
const S = (state, attrs = {}) => ({ state: String(state), attributes: attrs });
const U = (v, unit) => S(v, { unit_of_measurement: unit });
const base = {

  "sf-climate-card": { mode: "input_select.mode", rooms: [{ name: "Living", climate: "climate.room", temp: "sensor.temp", hum: "sensor.hum", target: "input_number.target", regul: "input_boolean.auto", window: "binary_sensor.window" }] },
  "sf-console-card": { title: "Controls", groups: [{ title: "Home", items: [{ kind: "dimmer", entity: "light.lamp", label: "Lamp" }, { kind: "toggle", entity: "switch.plug", label: "Plug" },

      ev_solar: "sensor.kwh", ev_grid: "sensor.kwh", devices: [{ name: "Heat pump", entity: "sensor.pac", icon: "mdi:heat-pump" }],

  "sf-cells-card": {},
  "sf-radiators-card": { radiators: [{ name: "Room", climate: "climate.room", preset: "select.room_preset", kwh: "sensor.kwh" }], setpoint: false },
  "sf-battery-card": { soc: "sensor.bat_soc", power: "sensor.bat_p", capacity_kwh: 10, charged_today: "sensor.kwh", discharged_today: "sensor.kwh", temperature: "sensor.temp", health: "sensor.hum", cycles: "sensor.kwh", mode: "input_select.mode" },
  "sf-launcher-card": { tiles: [{ name: "Climate", summary: "room", card: { type: "custom:sf-climate-card", rooms: [{ name: "L", climate: "climate.room", temp: "sensor.temp", target: "input_number.target" }] } },
    { name: "Battery", summary: "battery", card: { type: "custom:sf-battery-card", soc: "sensor.bat_soc", power: "sensor.bat_p" } }] },

// Même chose sans aucune entité de production solaire ni de batterie : rien de « solaire » ne doit apparaître.
const NOSOLAR = {
  "sf-bridge-card": { weather: "weather.home", outdoor: "sensor.out", price: "sensor.price" },
  "sf-reactor-card": { grid: "sensor.grid", devices: [{ name: "EV", entity: "sensor.ev" }] },
  "sf-ledger-card": { total_cost: "sensor.eur", devices: [{ name: "EV", total: "sensor.kwh", cost: "sensor.eur" }] },
  "sf-hangar-card": { cars: [], charger: { power: "sensor.ev" }, flows: { home: "sensor.pac" } },
  "sf-launcher-card": { tiles: [{ name: "Energy", summary: "energy", card: { type: "custom:sf-reactor-card", grid: "sensor.grid" } }] },
};

const failures = [];
const fail = (m) => failures.push(m);
const mount = (tag, cfg, language, states) => {
  const el = document.createElement(tag);
  el.setConfig(cfg);
  document.body.appendChild(el);
  el.hass = HASS(states || base, language);
  return el;
};
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const text = (el) => (el.shadowRoot ? el.shadowRoot.textContent : "");

// Enregistre les clés de traduction demandées mais absentes de la table (ou incomplètes) pour une langue ≠ fr.
__SF.SF_HOOK.tr = (lang, key) => {
  if (lang !== "fr") {
    const e = Object.prototype.hasOwnProperty.call(__SF.SF_T, key) ? __SF.SF_T[key] : undefined;
    if (!e) { if (/[^\x00-\x7F]|\s/.test(key)) window.__missing.add(`${lang}: ${key}`); }
    else if (e.length < 10 || e.some((x) => !x)) window.__missing.add(`${lang}: ${key} (incomplète)`);
  }
};

(async () => { try {
  // 1. Chaque carte, chaque langue, config complète : pas d'erreur, pas de rendu vide, pas de « undefined / NaN ».
  for (const language of ["en", "fr", "es", "de", "nl", "it", "pt", "pl", "ru", "zh", "ar"]) {
    for (const [tag, cfg] of Object.entries(FULL)) {
      const el = mount(tag, cfg, language);
      await wait(40);
      const t = text(el);
      if (!t.trim()) fail(`${tag} [${language}] : rendu vide`);
      if (/undefined|NaN|\[object|null/.test(t)) fail(`${tag} [${language}] : texte suspect « ${(t.match(/.{0,20}(undefined|NaN|\[object|null).{0,20}/) || [""])[0]} »`);
      el.remove();
    }
  }
  // 2. Config minimale (stub) : une carte vide ne doit jamais planter.
  for (const tag of Object.keys(FULL)) {
    try {
      const el = mount(tag, tag === "sf-launcher-card" ? { tiles: [] } : (customElements.get(tag).getStubConfig ? customElements.get(tag).getStubConfig() : {}), "en", {});
      await wait(30); el.remove();
    } catch (e) { fail(`${tag} : plante avec une config minimale (${e.message})`); }
  }
  // 3. Sans solaire ni batterie : aucune mention de solaire.
  for (const [tag, cfg] of Object.entries(NOSOLAR)) {
    const el = mount(tag, cfg, "en");
    await wait(40);
    if (/solar/i.test(text(el))) fail(`${tag} : affiche du solaire alors qu'aucune entité solaire n'est configurée`);
    el.remove();
  }
  // 4. Carte batterie sans entité : elle doit se masquer.
  { const el = mount("sf-battery-card", {}, "en"); await wait(40);
    if (getComputedStyle(el).display !== "none") fail("sf-battery-card sans entité : devrait être masquée"); el.remove(); }
  // 5. Lanceur : une carte standard de HA s'ouvre via les « card helpers ».
  window.loadCardHelpers = async () => ({ createCardElement: (c) => { const d = document.createElement("div"); d.className = "std-" + c.type; d.textContent = "STD " + c.type; return d; } });
  { const el = mount("sf-launcher-card", { tiles: [{ name: "Std", hash: "std", card: { type: "vertical-stack", cards: [] } }] }, "en");
    await wait(60);
    el.shadowRoot.querySelector(".tile").click();
    await wait(150);
    const pop = [...document.body.children].filter((n) => n.shadowRoot && n.shadowRoot.querySelector(".sheet")).pop();
    if (!pop || !pop.shadowRoot.querySelector(".std-vertical-stack")) fail("lanceur : une carte standard (vertical-stack) ne s'ouvre pas dans le popup");
    el.remove(); if (pop) pop.remove(); }
  // 5b. Heures creuses : plusieurs plages saisies (dont une qui passe minuit) font foi ; sans plage ni prix HC, HP/HC est inconnu.
  { const el = mount("sf-bridge-card", { weather: "weather.home", price: "sensor.price", hc_price: "sensor.price",
      hc_windows: [{ start: "22:00", end: "02:00" }, { start: "06:00", end: "08:00" }, { start: "14:00", end: "16:00" }] }, "en");
    await wait(40);
    const at = (h, m) => el._isHC(new Date(2026, 0, 5, h, m));
    const exp = [[23, 0, true], [1, 0, true], [4, 0, false], [7, 0, true], [12, 0, false], [15, 0, true], [20, 0, false]];
    for (const [h, m, want] of exp) if (at(h, m).hc !== want) fail(`bridge : à ${h}h${m} HC attendu ${want}, obtenu ${at(h, m).hc}`);
    if (at(15, 0).left !== 60) fail(`bridge : fin de HC à 16h attendue dans 60 min, obtenu ${at(15, 0).left}`);
    if (at(12, 0).left !== 120) fail(`bridge : prochaine HC à 14h attendue dans 120 min, obtenu ${at(12, 0).left}`);
    el.remove();
    const un = mount("sf-bridge-card", { weather: "weather.home", price: "sensor.price" }, "en"); await wait(40);
    if (un._isHC(new Date(2026, 0, 5, 3, 0)).hc !== null) fail("bridge : sans plage ni prix HC, HP/HC devrait être inconnu");
    if (/\bHP\b|\bHC\b/.test(text(un))) fail("bridge : affiche HP/HC alors que rien n'est configuré");
    un.remove(); }
  // 5b2. Consignes : toucher une valeur ouvre l'éditeur (bornes / pas de l'entité) ; « Appliquer » règle la portée choisie ; « Annuler » ne règle rien.
  { const IN = (v, mn, mx, st) => ({ state: String(v), attributes: { min: mn, max: mx, step: st } });
    const stt = { "input_number.a1": IN(19, 15, 25, 0.5), "input_number.a2": IN(21, 15, 25, 0.5), "input_number.b1": IN(18, 15, 25, 0.5), "input_number.b2": IN(20, 15, 25, 0.5) };
    const cfg = { columns: [{ label: "Day" }, { label: "Night" }], rows: [{ name: "Living", entities: ["input_number.a1", "input_number.a2"] }, { name: "Bed", entities: ["input_number.b1", "input_number.b2"] }] };
    const calls = []; const el = mount("sf-setpoints-card", cfg, "en"); el.hass = { ...HASS(stt, "en"), callService: (d, s, data) => { calls.push([d, s, data]); return Promise.resolve(); } }; await wait(60);
    const q = (sel) => el.shadowRoot.querySelector(sel);
    if (!q("[data-ed-open]")) fail("consignes : valeur non éditable (data-ed-open absent)");
    q('[data-ed-open="0,1"]').click(); await wait(60);
    if (!q("[data-ed-range]")) fail("consignes : l'éditeur ne s'ouvre pas au toucher d'une valeur");
    if (q("[data-ed-range]").max !== "25" || q("[data-ed-range]").step !== "0.5") fail("consignes : bornes/pas de l'entité non repris par le curseur");
    if (!/21/.test(q("[data-ed-out]").textContent)) fail("consignes : valeur de départ attendue 21");
    q('[data-ed="inc"]').click(); q('[data-ed="inc"]').click(); await wait(10);
    if (!/22/.test(q("[data-ed-out]").textContent)) fail("consignes : deux « + » attendus → 22");
    for (let k = 0; k < 30; k++) q('[data-ed="inc"]').click();
    if (!/25/.test(q("[data-ed-out]").textContent)) fail("consignes : la valeur doit s'arrêter à la borne 25");
    q('[data-ed="cancel"]').click(); await wait(60);
    if (calls.length) fail("consignes : « Annuler » ne doit rien régler"); if (q("[data-ed-range]")) fail("consignes : l'éditeur reste ouvert après « Annuler »");
    q('[data-ed-open="0,1"]').click(); await wait(60);
    q('[data-ed="inc"]').click(); q('[data-ed-scope="col"]').click(); q('[data-ed="ok"]').click(); await wait(80);
    const got = calls.map((c) => `${c[2].entity_id}=${c[2].value}`).sort().join(",");
    if (got !== "input_number.a2=21.5,input_number.b2=21.5") fail(`consignes : portée « programme » attendue sur les 2 pièces (obtenu ${got})`);
    if (calls.some((c) => c[0] !== "input_number" || c[1] !== "set_value")) fail("consignes : service attendu input_number.set_value");
    if (q("[data-ed-range]")) fail("consignes : l'éditeur doit se fermer après « Appliquer »");
    calls.length = 0; q('[data-ed-open="1,0"]').click(); await wait(60); q('[data-ed-scope="row"]').click(); q('[data-ed="dec"]').click(); q('[data-ed="ok"]').click(); await wait(80);
    if (calls.map((c) => `${c[2].entity_id}=${c[2].value}`).sort().join(",") !== "input_number.b1=17.5,input_number.b2=17.5") fail("consignes : portée « pièce » attendue sur la ligne");
    el.remove(); }
  // 5c. Arabe : sens d'écriture inversé sur la carte ; les autres langues restent de gauche à droite.
  { const ar = mount("sf-machines-card", FULL["sf-machines-card"], "ar"); const en = mount("sf-machines-card", FULL["sf-machines-card"], "en"); await wait(40);
    if (ar.dir !== "rtl") fail("arabe : la carte devrait être en sens rtl"); if (en.dir !== "ltr") fail("anglais : la carte devrait être en sens ltr");
    ar.remove(); en.remove(); }
  // 5d. Variantes de langue de HA (pt-BR, zh-Hans…) : retombent sur la langue de base.
  { const a = mount("sf-radiators-card", FULL["sf-radiators-card"], "pt-BR"); const b = mount("sf-radiators-card", FULL["sf-radiators-card"], "zh-Hans"); await wait(40);
    if (!/Radiadores/.test(text(a))) fail("pt-BR : « Radiadores » attendu"); if (!/暖气片/.test(text(b))) fail("zh-Hans : « 暖气片 » attendu"); a.remove(); b.remove(); }
  // 5e. Plusieurs batteries : niveau pondéré par la capacité (80 % de 10 kWh + 20 % de 5 kWh = 60 %), puissance cumulée,
  //     détail par batterie ; sans capacité, moyenne simple ; un seul nœud dans la carte énergie ; une batterie indisponible est ignorée.
  { const st = { ...base, "sensor.b1": U(80, "%"), "sensor.b1p": U(-1000, "W"), "sensor.b2": U(20, "%"), "sensor.b2p": U(400, "W"), "sensor.b3": S("unavailable") };
    const two = [{ name: "Garage", soc: "sensor.b1", power: "sensor.b1p", capacity_kwh: 10 }, { name: "Cellar", soc: "sensor.b2", power: "sensor.b2p", capacity_kwh: 5 }];
    const c1 = mount("sf-battery-card", { batteries: two }, "en", st); await wait(40); const t1 = text(c1);
    const ring = (el) => (el.shadowRoot.querySelector(".ring .t b") || { textContent: "" }).textContent.trim();
    if (ring(c1) !== "60%") fail(`batteries : niveau pondéré 60 % attendu, obtenu « ${ring(c1)} »`);
    if (!/Garage/.test(t1) || !/Cellar/.test(t1)) fail("batteries : le détail par batterie (noms) est absent");
    if (!/600\s*W/.test(t1)) fail("batteries : puissance cumulée 600 W attendue");
    if (!/Charging/.test(t1)) fail("batteries : état « Charging » attendu (somme négative)");
    c1.remove();
    const c2 = mount("sf-battery-card", { batteries: [{ name: "A", soc: "sensor.b1" }, { name: "B", soc: "sensor.b2" }] }, "en", st); await wait(40);
    if (ring(c2) !== "50%") fail(`batteries : sans capacité, moyenne simple 50 % attendue, obtenu « ${ring(c2)} »`); c2.remove();
    const c3 = mount("sf-battery-card", { batteries: [{ name: "A", soc: "sensor.b1", capacity_kwh: 10 }, { name: "Dead", soc: "sensor.b3", capacity_kwh: 10 }] }, "en", st); await wait(40);
    if (ring(c3) !== "80%") fail(`batteries : une batterie indisponible doit être ignorée (80 % attendu), obtenu « ${ring(c3)} »`); c3.remove();
    const r = mount("sf-reactor-card", { grid: "sensor.grid", batteries: two, devices: [] }, "en", st); await wait(40);
    const nodes = (r.shadowRoot.querySelectorAll(".node") || []); const batNodes = [...nodes].filter((n) => /Battery/.test(n.textContent));
    if (batNodes.length !== 1) fail(`batteries : un seul nœud batterie attendu dans la carte énergie, obtenu ${batNodes.length}`);
    if (batNodes[0] && !/Battery 60 %/.test(batNodes[0].textContent)) fail(`batteries : le nœud devrait afficher « Battery 60 % », obtenu « ${batNodes[0].textContent.trim()} »`);
    r.remove();
    const l = mount("sf-launcher-card", { tiles: [{ name: "Bat", summary: "battery", card: { type: "custom:sf-battery-card", batteries: two } }] }, "en", st); await wait(40);
    if (!/60 %/.test((l.shadowRoot.querySelector(".tile .main") || { textContent: "" }).textContent)) fail("batteries : la tuile du lanceur devrait afficher 60 %"); l.remove(); }
  // 5f. Carte énergie : le solaire est toujours AU-DESSUS du cœur (même abscisse, plus haut), sur téléphone comme sur grand écran.
