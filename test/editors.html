<!doctype html>
<meta charset="utf-8">
<!-- Editor test (run by run.sh in headless Chrome): the visual editors of all cards, given hostile values everywhere (configuration, entity states,
     entity / device / area registries), must not execute or inject anything, must not throw, and must emit valid, clean configuration. Their
     forms are Home Assistant's own `ha-form` / `ha-entity-picker`, replaced here by inert stand-ins. Writes its verdict (JSON) into #result. -->
<body>
<script>
// inert stand-ins for HA's components: they only hold the properties the editors set
class FakeForm extends HTMLElement { set schema(v) { this._s = v; } get schema() { return this._s; } set data(v) { this._d = v; } get data() { return this._d; } set hass(v) { this._h = v; } get hass() { return this._h; } }
customElements.define("ha-form", FakeForm);
class FakePicker extends HTMLElement { set hass(v) {} set value(v) { this._v = v; } get value() { return this._v; } }
customElements.define("ha-entity-picker", FakePicker);
class FakeIcon extends HTMLElement {} customElements.define("ha-icon", FakeIcon);
window.requestAnimationFrame = (f) => setTimeout(f, 0);
window.__SF_TEST = true; window.__x = 0;
window.__errs = [];
window.addEventListener("error", (e) => window.__errs.push(`${e.message} @${(e.filename || "").split("/").pop()}:${e.lineno}`));
window.addEventListener("unhandledrejection", (e) => window.__errs.push(`unhandled rejection: ${e.reason && e.reason.message || e.reason}`));
</script>
<script src="../dist/sf-cards.js"></script>
<script src="fixtures.js"></script>
<script>
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const fails = [];
const PAY = '"><img src=x onerror="window.__x++"><svg onload="window.__x++"> \'onmouseover=\'window.__x++\' javascript:void(0)';
const deep = (o, f) => Array.isArray(o) ? o.map((x) => deep(x, f)) : o && typeof o === "object" ? Object.fromEntries(Object.entries(o).map(([k, v]) => [k, deep(v, f)])) : typeof o === "string" ? f(o) : o;
const unsafe = (root) => { let n = 0; const walk = (r) => { for (const e of r.querySelectorAll("*")) { if (e.localName === "script" || [...e.attributes].some((a) => /^on/i.test(a.name)) || ["src", "href"].some((k) => /^\s*(javascript|vbscript):/i.test(e.getAttribute(k) || ""))) n++; if (e.shadowRoot) walk(e.shadowRoot); } }; walk(root); return n; };
// hostile Home Assistant: states, registries, areas, devices
const hostileHass = () => { const st = {}; for (const [id, s] of Object.entries(base)) st[id] = { entity_id: id, state: PAY, attributes: { ...Object.fromEntries(Object.entries(s.attributes || {}).map(([k, v]) => [k, typeof v === "string" ? PAY : v])), friendly_name: PAY, icon: PAY, device_class: "battery", unit_of_measurement: "%" }, last_changed: new Date().toISOString() };
  const ents = Object.fromEntries(Object.keys(st).map((id, i) => [id, { entity_id: id, device_id: "dev" + (i % 3), area_id: "area1", name: PAY, platform: PAY, hidden: false, labels: [PAY] }]));
  return { states: st, entities: ents, devices: Object.fromEntries([0, 1, 2].map((i) => ["dev" + i, { id: "dev" + i, name: PAY, name_by_user: PAY, area_id: "area1" }])), areas: { area1: { area_id: "area1", name: PAY } },
    locale: { language: "en" }, language: "en", themes: {}, callService: () => Promise.resolve(), callWS: () => Promise.resolve([]), config: { unit_system: { temperature: "°C" } } }; };
async function pass(label, tag, cfg, hass, act) {
  const before = window.__errs.length; let ed;
  try { ed = document.createElement(tag + "-editor"); ed.hass = hass; ed.setConfig(cfg); document.body.appendChild(ed); await wait(50); if (act) await act(ed); await wait(30); }
  catch (e) { fails.push(`${tag} [${label}]: threw ${e.message}`); }
  const errs = window.__errs.splice(before); if (errs.length) fails.push(`${tag} [${label}]: ${[...new Set(errs)].slice(0, 2).join(" | ")}`);
  if (ed) { if (ed.shadowRoot && unsafe(ed.shadowRoot)) fails.push(`${tag} [${label}]: active content in the editor`); if (!ed.shadowRoot || !ed.shadowRoot.innerHTML.length) fails.push(`${tag} [${label}]: editor rendered nothing`); ed.remove(); }
}
(async () => {
  const tags = Object.keys(FULL).filter((t) => customElements.get(t) && customElements.get(t + "-editor"));
  if (tags.length < 25) fails.push(`only ${tags.length} editors found (test setup)`);
  const HH = hostileHass();
  for (const tag of tags) {
    await pass("hostile config", tag, deep(FULL[tag], () => PAY), HH);                      // every string of the configuration is hostile
    await pass("hostile ids", tag, deep(FULL[tag], (s) => /^[a-z_]+\.[a-z0-9_]+$/.test(s) ? s + PAY : s), HH);   // entity ids that carry markup
    await pass("hostile registries", tag, FULL[tag], HH);                                    // names of states / devices / areas
    await pass("empty / wrong config", tag, { title: 5, entities: "x", series: null, items: [null, 1] }, HH);
    await pass("no hass", tag, FULL[tag], undefined);
    await pass("edit", tag, FULL[tag], HH, async (ed) => {                                  // exercise the handlers: hostile values coming back from the forms, every button
      const emitted = []; ed.addEventListener("config-changed", (e) => emitted.push(e.detail.config));
      for (const f of ed.shadowRoot.querySelectorAll("ha-form")) f.dispatchEvent(new CustomEvent("value-changed", { detail: { value: deep(f.data || {}, () => PAY) }, bubbles: true }));
      await wait(10);
      for (const b of ed.shadowRoot.querySelectorAll("button, [role=button], summary, .add, .del, .up, .down")) { try { b.click(); } catch (e) { fails.push(`${tag} [edit]: a button click threw ${e.message}`); } }
      await wait(30);
      for (const c of emitted) { try { JSON.stringify(c); } catch (e) { fails.push(`${tag} [edit]: emitted a configuration that is not JSON`); } if (c && c.__proto__ !== Object.prototype) fails.push(`${tag} [edit]: emitted a configuration with a custom prototype`); }
    });
  }
  if (window.__x) fails.push(`a payload executed ${window.__x} time(s)`);
  const pre = document.createElement("pre"); pre.id = "result"; pre.textContent = JSON.stringify({ ok: !fails.length, failures: [...new Set(fails)].slice(0, 40) }); document.body.appendChild(pre);
})();
</script>
